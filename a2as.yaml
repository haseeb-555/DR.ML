          water, but avoid fluid overload', '- Avoid painkillers like NSAIDs', '- Monitor blood glucose regularly if diabetic',
        'Next Step: Schedule a follow-up with a kidney specialist. Stay calm, CKD can be managed with timely action and consistent
          care.']
      output_key: kidney_report_response
      instance: report_agent
