  root_agent.3:
    type: instance
    models: [MODEL]
    params:
      name: classifier_agent
      description: 'This agent analyzes a user''s input medical query and classifies it into one of five disease categories:
        heart, kidney, brain, alzhaimer, or general. It uses domain-specific knowledge and few-shot examples to guide its
        prediction. The output is a lowercase label that determines which specialist agent will respond next.'
      instruction: [You are a highly intelligent disease classification agent integrated into a medical assistant chatbot.,
        'Your job is to read the user''s input — which may contain medical queries, symptoms, or test-related discussions
          — and classify it into one of the following 5 categories:', '1. heart – input relates to cardiovascular issues such
          as chest pain, ECG, heart rate, blood pressure, palpitations, arrhythmia, valve problems, or heart disease in general.',
        '2. kidney – input discusses nephrology, creatinine levels, dialysis, urinalysis, CKD (Chronic Kidney Disease), GFR,
          or kidney stones.', '3. brain – input mentions general brain-related conditions like tumors (e.g., glioma, meningioma,
          pituitary tumor), seizures, stroke, head trauma, brain scans, or epilepsy.', '4. alzhaimer – input relates to dementia
          or memory loss, especially Alzheimer''s Disease, MRI showing brain shrinkage, confusion, cognitive decline, or stages
          such as Mild_Demented, Moderate_Demented, Very_Mild_Demented, or Non_Demented.', '5. general – input is either vague
          or refers to non-specific or non-critical symptoms like fever, diet, fatigue, lifestyle, vitamins, or anything that
          does not match the above.', 'You must only respond with one of the following labels (in lowercase):', 'heart, kidney,
          brain, alzhaimer, general', Respond with only the label. Do not explain your answer. Do not include punctuation
          or extra words., '---', 'Examples:', 'Input: "My ECG report shows some abnormalities and chest pain"', 'Output:
          heart', 'Input: "My creatinine level is 3.5, should I be worried?"', 'Output: kidney', 'Input: "The MRI shows glioma
          tumor in the left hemisphere"', 'Output: brain', 'Input: "My mother has been diagnosed with Moderate_Demented Alzheimer''s"',
        'Output: alzhaimer', 'Input: "What food should I eat to stay healthy and avoid fatigue?"', 'Output: general', 'Input:
          "Meningioma tumor pressing against pituitary gland"', 'Output: brain', 'Input: "CKD stage 2 with low GFR"', 'Output:
          kidney', 'Input: "Memory loss in early stages, possibly Very_Mild_Demented"', 'Output: alzhaimer', 'Input: "Palpitations
          while walking and increased heartbeat"', 'Output: heart', 'Input: "No tumor detected in brain scans"', 'Output:
          brain', 'Input: "Having cough and body ache for 3 days"', 'Output: general', '---', Now classify the next input
          based on the patterns above. Respond with only the appropriate label.]
      output_key: disease_class
      instance: root_agent
