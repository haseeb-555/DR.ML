functions:
  ask:
    type: async
    module: backend.chat.chatbot
    args: [request]
  classify_query:
    type: async
    module: backend.chat.chatbot
    args: [query]
    params:
      returns: str
  generate_alzhaimer_report:
    type: async
    module: backend.report.alzhaimer
    args: [image_file_bytes, patient_data]
  generate_brain_report:
    type: async
    module: backend.report.brain
    args: [image_file, patient_data]
  generate_heart_report:
    type: async
    module: backend.report.heart
    args: [formData, additionalInfo]
  generate_kidney_report:
    type: async
    module: backend.report.kidney
    args: [formData, additionalInfo]
  generate_report:
    type: async
    module: backend.chat.kidney
    args: [request]
  get_bot_response:
    type: async
    module: backend.chat.chatbot
    args: [label, query]
    params:
      returns: str
  get_chatbot_response:
    type: async
    module: backend.report.chatbot
    args: [query]
    params:
      returns: str
  get_model_features:
    type: sync
    module: backend.report.heart
  index:
    type: async
    module: backend.chat.kidney
    args: [request]
  load_model:
    type: sync
    module: backend.report.kidney
  predict:
    type: sync
    module: backend.report.alzhaimer
    args: [image_bytes]
  prepare_input:
    type: sync
    module: backend.report.heart
    args: [user_input]
  preprocess_image:
    type: sync
    module: backend.report.alzhaimer
    args: [image_bytes]
  preprocess_input:
    type: sync
    module: backend.report.kidney
    args: [user_input_dict]

variables:
  MODEL:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]

files:
  .env:
    type: literal
    actions: [read]
  backend/models/best_svm_model.pkl:
    type: literal
    actions: [read]
  backend/models/kidney.joblib:
    type: literal
    actions: [read]
  backend/models/svm_model_features.pkl:
    type: literal
    actions: [read]
  FEATURES_PATH:
    type: literal
    actions: [read]
    params:
      caller: [Path('backend/models/svm_model_features.pkl'), joblib.load]
  MODEL_PATH:
    type: literal
    actions: [read]
    params:
      caller: [Path('backend/models/best_svm_model.pkl'), joblib.load, torch.load]
  model_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.abspath]
  uploaded_file:
    type: variable
    actions: [read]
    params:
      caller: [Image.open]
